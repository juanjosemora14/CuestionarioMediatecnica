<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Test de orientación vocacional · Colegio Luis Amigo</title>
<style>
:root{--bg:#efeff6;--card:#ffffff;--ink:#0b231d;--mut:#4a5a54;--g:#1d6344;--gd:#084430;--r:#7d1629;--line:#d6d8e4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b231d;--card:#10352b;--ink:#efeff6;--mut:#b4c4bc;--g:#4fae85;--gd:#084430;--r:#e0768a;--line:#1d4a3c}}
:root[data-theme="dark"]{--bg:#0b231d;--card:#10352b;--ink:#efeff6;--mut:#b4c4bc;--g:#4fae85;--gd:#084430;--r:#e0768a;--line:#1d4a3c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Helvetica,Arial,sans-serif}
.w{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--r);padding-bottom:14px;margin-bottom:20px}
header img{height:64px;width:auto;background:#fff;padding:6px 8px;border-radius:8px}
header b{display:block;font-size:13px;letter-spacing:.08em;color:var(--r);text-transform:uppercase}header span{font-size:22px;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:6px 0 18px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.n{font-size:14px;color:var(--mut)}h2{font-size:24px;line-height:1.25;margin:6px 0 18px}
button.o{display:block;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer}
button.o:hover,button.o:focus-visible{border-color:var(--g);outline:none}
button.p{font:inherit;font-weight:700;font-size:17px;color:#fff;background:var(--g);border:0;border-radius:12px;padding:14px 24px;cursor:pointer}
.big{font-size:30px;font-weight:700;line-height:1.2;margin:8px 0 12px}.r{color:var(--r)}.g{color:var(--g)}
.row{margin:14px 0}.row div{display:flex;justify-content:space-between;font-weight:700;font-size:16px}
.row .bar{margin:6px 0 0;height:14px}.row .a i{background:var(--r)}
.note{font-size:14px;color:var(--mut);margin-top:18px}ul{padding-left:20px;line-height:1.6}
</style></head><body><div class="w">

<script>
var Q=[
["En un trabajo en grupo prefiero…","Coordinar y repartir las tareas","Encargarme de la parte técnica o digital"],
["Mi tiempo libre ideal es…","Organizar un plan o evento con amigos","Jugar, armar o programar algo en el computador"],
["Si algo falla, lo primero que hago es…","Buscar a la persona indicada para resolverlo","Averiguar yo mismo qué pasó y cómo arreglarlo"],
["Me atrae más…","Vender una idea o un producto","Crear una app o un videojuego"],
["Me siento más cómodo…","Hablando frente a otras personas","Concentrado resolviendo un reto lógico"],
["Me da más curiosidad saber…","Cómo funciona un negocio y sus cuentas","Cómo funciona un programa por dentro"],
["Ante un desafío prefiero…","Liderar al equipo","Encontrar la solución paso a paso"],
["Mis amigos me describen como alguien…","Comunicativo y organizado","Curioso y analítico"],
["Un proyecto soñado sería…","Montar mi propio negocio","Crear mi propia página web o app"],
["Cuando algo sale mal…","Analizo opciones y decido con el equipo","Pruebo, me equivoco y vuelvo a intentar"],
["En internet me gusta…","Ver emprendimientos y marketing","Aprender cómo se hace un juego o una web"]];
var i=0,a=0,app=document.getElementById("app");
function show(){
 if(i>=Q.length)return end();
 var q=Q[i];
 app.innerHTML='<div class="n">Pregunta '+(i+1)+' de '+Q.length+'</div><div class="bar"><i style="width:'+(i/Q.length*100)+'%"></i></div><h2>'+q[0]+'</h2><button class="o" data-k="a">'+q[1]+'</button><button class="o" data-k="b">'+q[2]+'</button>';
 app.querySelectorAll("button").forEach(function(b){b.onclick=function(){if(b.dataset.k==="a")a++;i++;show()}});
}
function end(){
 var b=Q.length-a,pa=Math.round(a/Q.length*100),pb=100-pa,adm=a>b,mix=Math.abs(a-b)<=1;
 var t=adm?"Administración de Empresas":"Técnico en Informática";
 var d=adm?"Te gusta organizar, comunicar, liderar y tomar decisiones. Podrías disfrutar la gestión de negocios, las ventas, el marketing y el emprendimiento.":"Te gusta resolver problemas, crear cosas que funcionan y aprender cómo funcionan por dentro. Podrías disfrutar la programación, el desarrollo web y el soporte técnico.";
 var h=(mix?'<div class="n">Perfil mixto</div><div class="big">Tu perfil combina ambos caminos, con ligera inclinación hacia <span class="'+(adm?'r':'g')+'">'+t+'</span></div><p>Muchos negocios nacen de unir gestión y tecnología. Habla con docentes y profesionales de las dos áreas antes de decidir.</p>':'<div class="n">Tu perfil se ajusta mejor a</div><div class="big '+(adm?'r':'g')+'">'+t+'</div><p>'+d+'</p>');
 h+='<div class="row"><div><span>Administración de Empresas</span><span>'+pa+'%</span></div><div class="bar a"><i style="width:'+pa+'%;background:var(--r)"></i></div></div><div class="row"><div><span>Técnico en Informática</span><span>'+pb+'%</span></div><div class="bar"><i style="width:'+pb+'%"></i></div></div>';
 h+='<p class="note">Este test es una orientación inicial, no una decisión definitiva. Explora, pregunta y prueba antes de elegir.</p><button class="p" id="re">Repetir el test</button>';
 app.innerHTML=h;document.getElementById("re").onclick=function(){i=0;a=0;show()};
}
show();
</script></body></html>
